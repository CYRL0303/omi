[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omi-live-football"
version = "0.1.0"
description = "An Omi Chat Tool for live football data and commentary."
requires-python = ">=3.12"
dependencies = [
    "EasySoccerData @ git+https://github.com/manucabral/EasySoccerData.git@199dcf009b97273e5180c03d7dc7d9ef263aba5b",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "rapidfuzz>=3.10,<4",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omi_live_football"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
